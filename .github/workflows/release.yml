name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and notes
        run: |
          peeled="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          test -n "$peeled"
          test "$peeled" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release.ts --tag "$GITHUB_REF_NAME" --notes-file /tmp/codex-pocket-release-notes.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @codex-pocket/host build
      - run: pnpm --filter @codex-pocket/web build

  publish-draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.ts --tag "$GITHUB_REF_NAME" --notes-file release-notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "Codex Pocket $GITHUB_REF_NAME" \
            --notes-file release-notes.md "${flags[@]}"
