name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release tag and notes
        run: |
          peeled="$(git ls-remote origin "refs/tags/${GITHUB_REF_NAME}^{}" | cut -f1)"
          test -n "$peeled"
          test "$peeled" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          node scripts/check-release.ts --tag "$GITHUB_REF_NAME" --notes-file /tmp/codex-pocket-release-notes.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @codex-pocket/host build
      - run: pnpm --filter @codex-pocket/web build
      - run: node scripts/package-linux.ts
      - run: pnpm package:linux:check

  publish-draft:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: pnpm package:linux
      - run: pnpm package:linux:check
      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/check-release.ts --tag "$GITHUB_REF_NAME" --notes-file release-notes.md
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --title "Codex Pocket $GITHUB_REF_NAME" \
            --notes-file release-notes.md "${flags[@]}"
          gh release upload "$GITHUB_REF_NAME" release/linux/*.tar.gz release/linux/*.sha256
