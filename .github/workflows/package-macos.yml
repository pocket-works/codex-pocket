name: Build unsigned macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: make app
      - name: Archive app and checksum
        run: |
          test -s "packages/desktop/release/mac-arm64/Codex Pocket.app/Contents/Resources/legal/THIRD-PARTY-NOTICES.txt"
          ditto -c -k --keepParent "packages/desktop/release/mac-arm64/Codex Pocket.app" unsigned-codex-pocket-macos-arm64.zip
          shasum -a 256 unsigned-codex-pocket-macos-arm64.zip > unsigned-codex-pocket-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-codex-pocket-macos-arm64-${{ github.sha }}
          path: |
            unsigned-codex-pocket-macos-arm64.zip
            unsigned-codex-pocket-macos-arm64.zip.sha256
          if-no-files-found: error
